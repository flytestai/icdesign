<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · IC 后端学院</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7fd0'/%3E%3Cpath d='M9 21V11h3v7h7v3z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--accent:#2f7fd0;--ink:#1d2733;--ink2:#5a6b7d;--line:#dfe7ef;--soft:#f2f6fa;--ok:#18a07a;--bad:#c04a4a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#f2f6fa 0%,#e8f0f8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.card{width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 32px;box-shadow:0 10px 40px rgba(47,127,208,.10)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);position:relative}
.mark::after{content:"";position:absolute;left:11px;top:9px;width:12px;height:16px;border-left:3px solid #fff;border-bottom:3px solid #fff}
.brand b{font-size:18px}
.brand i{font-size:12px;color:var(--ink2);font-style:normal;margin-left:2px}
h1{font-size:22px;margin:14px 0 4px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:22px}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;outline:none;transition:border .15s}
input:focus{border-color:var(--accent)}
button.pri{width:100%;margin-top:22px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.pri:hover{background:#276ab0}
button.pri:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;font-size:14px;border-radius:8px;padding:10px 12px;display:none}
.msg.err{display:block;background:#fdf0f0;color:var(--bad)}
.msg.ok{display:block;background:#eef8f4;color:var(--ok);line-height:1.7}
.foot{margin-top:18px;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between}
.foot a{color:var(--accent);text-decoration:none}
#done{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"></span><b>IC 后端学院</b><i>Backend Academy</i></div>
  <div id="form-area">
    <h1>注册学员账号</h1>
    <p class="sub">注册后需管理员审核，通过后即可观看全部课程。</p>
    <form id="f">
      <label>真实姓名</label>
      <input id="name" maxlength="20" placeholder="请输入真实姓名（审核用）" required>
      <label>手机号</label>
      <input id="phone" type="tel" maxlength="11" placeholder="11 位手机号，将作为登录账号" required>
      <label>密码（至少 6 位）</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="设置密码" required>
      <label>确认密码</label>
      <input id="password2" type="password" autocomplete="new-password" placeholder="再输入一次" required>
      <button class="pri" id="btn" type="submit">提交注册</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">
      <a href="/login">已有账号？去登录 →</a>
      <a href="/login">返回</a>
    </div>
  </div>
  <div id="done">
    <h1>✅ 注册已提交</h1>
    <p class="sub" style="margin-top:10px;line-height:1.8">请等待管理员审核。<br>审核通过后即可用手机号 + 密码登录学习。</p>
    <div class="msg ok" id="okmsg"></div>
    <div class="foot"><a href="/login">去登录页 →</a></div>
  </div>
</div>
<script>
var msg=document.getElementById('msg');
function showErr(t){msg.className='msg err';msg.textContent=t;}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var pw=document.getElementById('password').value;
  var pw2=document.getElementById('password2').value;
  if(!/^1[3-9]\d{9}$/.test(phone)){showErr('手机号格式不正确（11 位大陆手机号）');return;}
  if(pw.length<6){showErr('密码至少 6 位');return;}
  if(pw!==pw2){showErr('两次输入的密码不一致');return;}
  var btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='提交中…';
  fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name,phone:phone,password:pw})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(res){
    if(!res.ok){showErr(res.j.detail||'注册失败');btn.disabled=false;btn.textContent='提交注册';return;}
    document.getElementById('form-area').style.display='none';
    document.getElementById('done').style.display='block';
    document.getElementById('okmsg').textContent='姓名：'+name+'　手机号：'+phone;
  })
  .catch(function(){showErr('网络异常，请稍后重试');btn.disabled=false;btn.textContent='提交注册';});
});
</script>
</body>
</html>
