<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排行榜 | IC 后端学院</title>
<meta name="description" content="按累计学习时长排名，看看自己排第几。">
<link rel="icon" href="/assets/logo.svg?v=b39bbc9abada" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css?v=b39bbc9abada">
</head>
<body data-page="leaderboard" data-lesson="leaderboard">
<header class="top">
  <a class="logo" href="/"><img class="mark" src="/assets/logo.svg?v=b39bbc9abada" alt="IC 后端学院"><b>IC 后端学院</b><i>Backend Academy</i></a>
  <nav class="top-nav"><a href="/">课程</a><a href="/playground/">练习场</a><a href="/quiz/">题库</a><a href="/exam/">验收</a><a href="/glossary/">术语</a><a href="/abbr/">缩写</a><a href="/cheatsheet/">速查</a><a href="/search/">搜索</a><a href="/progress/">进度</a><a class="on" href="/leaderboard/">排行</a></nav>
  <div class="top-right"><a class="ghost" href="/">← 课程</a>
<div id="userchip" class="userchip" hidden>
  <span class="uc-ava" id="uc-ava" aria-hidden="true"></span>
  <span class="uc-name" id="uc-name"></span>
  <span class="uc-role" id="uc-role" hidden>管理员</span>
  <a id="uc-admin" href="/admin" hidden>审核管理</a>
  <button id="uc-logout" type="button">退出</button>
</div>
<script>
(function(){
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(u){
    var el=document.getElementById('userchip');
    if(!el)return;
    el.hidden=false;
    var n=u.name||'学员';
    document.getElementById('uc-ava').textContent=n.charAt(0);
    document.getElementById('uc-name').textContent=n;
    if(u.role==='admin'){
      document.getElementById('uc-admin').hidden=false;
      document.getElementById('uc-role').hidden=false;
    }
    document.getElementById('uc-logout').addEventListener('click',function(){
      fetch('/api/auth/logout',{method:'POST'}).then(function(){location.href='/login';});
    });
  }).catch(function(){});
})();
</script></div>
</header>
<main class="sub">
<div class="sub-h"><h1>排行榜</h1><p>按累计学习时长排名，看看自己排第几。</p></div>
<div class="lb-wrap">
  <div class="lb-hero">
    <h2>学习排行榜</h2>
    <p>仅统计课程页和代码练习场在前台的学习时长，连续 2 分钟无操作后暂停计时。</p>
  </div>
  <div class="lb-me" id="lb-me" hidden></div>
  <div class="lb-card">
    <div class="lb-thead"><span class="c-rk">名次</span><span class="c-nm">学员</span><span class="c-tm">学习时长</span></div>
    <div id="lb-rows" class="lb-rows"><div class="lb-loading">加载中…</div></div>
  </div>
  <div class="lb-note">榜单包含已审核通过的学员和管理员。</div>
</div>

</main>
<script src="/assets/shell.js?v=b39bbc9abada"></script>
<script src="/assets/tcl.js?v=b39bbc9abada"></script>
<script src="/assets/page.js?v=b39bbc9abada"></script>
<script src="/assets/playground.js?v=b39bbc9abada"></script>
<script src="/assets/aiwidget.js?v=b39bbc9abada" defer></script>
</body>
</html>
