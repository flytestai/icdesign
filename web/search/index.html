<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索 | IC 后端学院</title>
<meta name="description" content="全站章节级搜索，命中后直接跳到对应小节。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7fd0'/%3E%3Cpath d='M9 21V11h3v7h7v3z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css?v=1795429914">
</head>
<body data-page="search" data-lesson="search">
<header class="top">
  <a class="logo" href="/"><span class="mark"></span><b>IC 后端学院</b><i>Backend Academy</i></a>
  <nav class="top-nav"><a href="/">课程</a><a href="/playground/">练习场</a><a href="/quiz/">题库</a><a href="/exam/">验收</a><a href="/glossary/">术语</a><a href="/cheatsheet/">速查</a><a class="on" href="/search/">搜索</a><a href="/progress/">进度</a></nav>
  <div class="top-right"><a class="ghost" href="/">← 课程</a></div>
</header>
<main class="sub">
<div class="sub-h"><h1>搜索</h1><p>全站章节级搜索，命中后直接跳到对应小节。</p></div>
<div class="sbar">
  <input id="s-q" type="search" placeholder="搜课程内容，例如 setup hold / 拥塞 / tluplus / ECO">
  <span id="s-n" class="gn"></span>
</div>
<div id="s-hint" class="shint">输入关键词，回车。支持多个词（空格分隔，全部命中才显示）。</div>
<div id="s-list" class="slist"></div>

</main>
<script src="/assets/shell.js?v=1795429914"></script>
<script src="/assets/tcl.js?v=1795429914"></script>
<script src="/assets/page.js?v=1795429914"></script>

<div id="userchip" class="userchip" hidden>
  <span id="uc-name"></span>
  <a id="uc-admin" href="/admin" hidden>审核管理</a>
  <button id="uc-logout" type="button">退出</button>
</div>
<script>
(function(){
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(u){
    var el=document.getElementById('userchip');
    if(!el)return;
    el.hidden=false;
    document.getElementById('uc-name').textContent=u.name+(u.role==='admin'?'（管理员）':'');
    if(u.role==='admin')document.getElementById('uc-admin').hidden=false;
    document.getElementById('uc-logout').addEventListener('click',function(){
      fetch('/api/auth/logout',{method:'POST'}).then(function(){location.href='/login';});
    });
  }).catch(function(){});
})();
</script>
</body>
</html>
