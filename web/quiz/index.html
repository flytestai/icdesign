<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>题库 | IC 后端学院</title>
<meta name="description" content="217 道自测题，按阶段筛选、随机抽题、自动记错题。">
<link rel="icon" href="/assets/logo.svg?v=1795499490" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css?v=1795499490">
</head>
<body data-page="quiz" data-lesson="quiz">
<header class="top">
  <a class="logo" href="/"><img class="mark" src="/assets/logo.svg?v=1795499490" alt="IC 后端学院"><b>IC 后端学院</b><i>Backend Academy</i></a>
  <nav class="top-nav"><a href="/">课程</a><a href="/playground/">练习场</a><a class="on" href="/quiz/">题库</a><a href="/exam/">验收</a><a href="/glossary/">术语</a><a href="/abbr/">缩写</a><a href="/cheatsheet/">速查</a><a href="/search/">搜索</a><a href="/progress/">进度</a></nav>
  <div class="top-right"><a class="ghost" href="/">← 课程</a>
<div id="userchip" class="userchip" hidden>
  <span class="uc-ava" id="uc-ava" aria-hidden="true"></span>
  <span class="uc-name" id="uc-name"></span>
  <span class="uc-role" id="uc-role" hidden>管理员</span>
  <a id="uc-admin" href="/admin" hidden>审核管理</a>
  <button id="uc-logout" type="button">退出</button>
</div>
<script>
(function(){
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(u){
    var el=document.getElementById('userchip');
    if(!el)return;
    el.hidden=false;
    var n=u.name||'学员';
    document.getElementById('uc-ava').textContent=n.charAt(0);
    document.getElementById('uc-name').textContent=n;
    if(u.role==='admin'){
      document.getElementById('uc-admin').hidden=false;
      document.getElementById('uc-role').hidden=false;
    }
    document.getElementById('uc-logout').addEventListener('click',function(){
      fetch('/api/auth/logout',{method:'POST'}).then(function(){location.href='/login';});
    });
  }).catch(function(){});
})();
</script></div>
</header>
<main class="sub">
<div class="sub-h"><h1>题库</h1><p>217 道自测题，按阶段筛选、随机抽题、自动记错题。</p></div>
<div class="qbar">
  <div class="qbar-l">
    <button class="tab on" data-tab="draw" type="button">随机抽题</button>
    <button class="tab" data-tab="wrong" type="button">错题本 <i id="wrong-n">0</i></button>
    <button class="tab" data-tab="all" type="button">全部题目</button>
  </div>
  <div class="qbar-r">
    <select id="q-stage"><option value="">全部阶段</option></select>
    <button class="pri" id="q-start" type="button">开始 10 题</button>
  </div>
</div>
<div id="quiz-panel" class="qpanel"><p class="qempty">点右上角"开始 10 题"，随机抽 10 道；答完点"看答案"自评，答错的会自动进错题本。</p></div>

</main>
<script src="/assets/shell.js?v=1795499490"></script>
<script src="/assets/tcl.js?v=1795499490"></script>
<script src="/assets/page.js?v=1795499490"></script>
<script src="/assets/playground.js?v=1795499490"></script>
</body>
</html>
