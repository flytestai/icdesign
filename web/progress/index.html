<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习进度 | IC 后端学院</title>
<meta name="description" content="按阶段看完成度，知道下一步该学哪一章。">
<link rel="icon" href="/assets/logo.svg?v=1795608245" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css?v=1795608245">
</head>
<body data-page="progress" data-lesson="progress">
<header class="top">
  <a class="logo" href="/"><img class="mark" src="/assets/logo.svg?v=1795608245" alt="IC 后端学院"><b>IC 后端学院</b><i>Backend Academy</i></a>
  <nav class="top-nav"><a href="/">课程</a><a href="/playground/">练习场</a><a href="/quiz/">题库</a><a href="/exam/">验收</a><a href="/glossary/">术语</a><a href="/abbr/">缩写</a><a href="/cheatsheet/">速查</a><a href="/search/">搜索</a><a class="on" href="/progress/">进度</a><a href="/leaderboard/">排行</a></nav>
  <div class="top-right"><a class="ghost" href="/">← 课程</a>
<div id="userchip" class="userchip" hidden>
  <span class="uc-ava" id="uc-ava" aria-hidden="true"></span>
  <span class="uc-name" id="uc-name"></span>
  <span class="uc-role" id="uc-role" hidden>管理员</span>
  <a id="uc-admin" href="/admin" hidden>审核管理</a>
  <button id="uc-logout" type="button">退出</button>
</div>
<script>
(function(){
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():Promise.reject();}).then(function(u){
    var el=document.getElementById('userchip');
    if(!el)return;
    el.hidden=false;
    var n=u.name||'学员';
    document.getElementById('uc-ava').textContent=n.charAt(0);
    document.getElementById('uc-name').textContent=n;
    if(u.role==='admin'){
      document.getElementById('uc-admin').hidden=false;
      document.getElementById('uc-role').hidden=false;
    }
    document.getElementById('uc-logout').addEventListener('click',function(){
      fetch('/api/auth/logout',{method:'POST'}).then(function(){location.href='/login';});
    });
  }).catch(function(){});
})();
</script></div>
</header>
<main class="sub">
<div class="sub-h"><h1>学习进度</h1><p>按阶段看完成度，知道下一步该学哪一章。</p></div>
<div class="pwrap">
  <div class="pstats">
    <div><b id="p-pct">0%</b><span>总完成度</span></div>
    <div><b id="p-ch">0/0</b><span>已完成章节</span></div>
    <div class="pnext"><b id="p-next">—</b><span>下一课</span><i id="p-next-sub">—</i></div>
  </div>
  <div class="pbar"><i id="p-fill"></i></div>
  <div id="p-stages" class="pstages"></div>
  <div class="pnote">进度同时存在本机与服务器（匿名设备 ID），换设备用同一个浏览器可恢复；清浏览器数据会丢本机记录。</div>
</div>

</main>
<script src="/assets/shell.js?v=1795608245"></script>
<script src="/assets/tcl.js?v=1795608245"></script>
<script src="/assets/page.js?v=1795608245"></script>
<script src="/assets/playground.js?v=1795608245"></script>
<script src="/assets/aiwidget.js?v=1795608245" defer></script>
</body>
</html>
