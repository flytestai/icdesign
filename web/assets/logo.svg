<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- CPU 芯片俯视图标（按参考图重绘）：方形圆角芯片体 + 中心方形镂空 die + 四边各两根引脚 -->
  <g fill="#2f7fd0">
    <!-- 上引脚 -->
    <rect x="10" y="0" width="5" height="10" rx="2"/>
    <rect x="21" y="0" width="5" height="10" rx="2"/>
    <!-- 下引脚 -->
    <rect x="10" y="26" width="5" height="10" rx="2"/>
    <rect x="21" y="26" width="5" height="10" rx="2"/>
    <!-- 左引脚 -->
    <rect x="0" y="10" width="10" height="5" rx="2"/>
    <rect x="0" y="21" width="10" height="5" rx="2"/>
    <!-- 右引脚 -->
    <rect x="26" y="10" width="10" height="5" rx="2"/>
    <rect x="26" y="21" width="10" height="5" rx="2"/>
    <!-- 芯片体 -->
    <rect x="7" y="7" width="22" height="22" rx="4.5"/>
  </g>
  <!-- 中心 die 镂空 -->
  <rect x="14.5" y="14.5" width="7" height="7" rx="1" fill="#ffffff"/>
</svg>
