<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f92e2"/>
      <stop offset="1" stop-color="#1a5ea6"/>
    </linearGradient>
  </defs>
  <!-- 底板 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- 四边引脚：每边 3 根 -->
  <g fill="#d8e9f9" opacity="0.92">
    <rect x="7.6"  y="3"   width="2.4" height="4.4" rx="1.1"/>
    <rect x="14.8" y="3"   width="2.4" height="4.4" rx="1.1"/>
    <rect x="22"   y="3"   width="2.4" height="4.4" rx="1.1"/>
    <rect x="7.6"  y="24.6" width="2.4" height="4.4" rx="1.1"/>
    <rect x="14.8" y="24.6" width="2.4" height="4.4" rx="1.1"/>
    <rect x="22"   y="24.6" width="2.4" height="4.4" rx="1.1"/>
    <rect x="3"   y="7.6"  width="4.4" height="2.4" rx="1.1"/>
    <rect x="3"   y="14.8" width="4.4" height="2.4" rx="1.1"/>
    <rect x="3"   y="22"   width="4.4" height="2.4" rx="1.1"/>
    <rect x="24.6" y="7.6"  width="4.4" height="2.4" rx="1.1"/>
    <rect x="24.6" y="14.8" width="4.4" height="2.4" rx="1.1"/>
    <rect x="24.6" y="22"   width="4.4" height="2.4" rx="1.1"/>
  </g>
  <!-- 封装体 -->
  <rect x="9.2" y="9.2" width="13.6" height="13.6" rx="2.6" fill="#ffffff" opacity="0.16"/>
  <rect x="9.2" y="9.2" width="13.6" height="13.6" rx="2.6" fill="none" stroke="#eaf3fc" stroke-width="1.1" opacity="0.85"/>
  <!-- 走线：die 到封装边 -->
  <g stroke="#ffffff" stroke-width="1.3" opacity="0.7" stroke-linecap="round">
    <path d="M16 12.6V10.2"/>
    <path d="M16 19.4v2.4"/>
    <path d="M12.6 16h-2.4"/>
    <path d="M19.4 16h2.4"/>
  </g>
  <!-- 中心 die -->
  <rect x="13.4" y="13.4" width="5.2" height="5.2" rx="1.2" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1.15" fill="#2f7fd0"/>
</svg>
