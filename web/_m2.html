<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;font:12px monospace}iframe{width:390px;height:900px;border:0}#o{white-space:pre-wrap}</style></head><body>
<iframe id="f" src="/lesson/05-02-pt/"></iframe><pre id="o">pending</pre>
<script>
document.getElementById('f').onload=function(){setTimeout(function(){
 var d=document.getElementById('f').contentDocument,w=document.getElementById('f').contentWindow,vw=w.innerWidth,L=[];
 var all=d.querySelectorAll('*'),seen={},rows=[];
 for(var i=0;i<all.length;i++){var e=all[i],r=e.getBoundingClientRect();
  if(r.right>vw+0.5&&r.width>0){var k=e.tagName+'.'+(e.className||'');if(!seen[k]){seen[k]=1;rows.push(k+' over='+Math.round(r.right-vw));}}}
 L.push('kinds='+rows.length); rows.slice(0,10).forEach(function(x){L.push(x)});
 document.getElementById('o').textContent=L.join('\n');
},900)};
</script></body></html>
