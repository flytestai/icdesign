<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">两条 GCell 边要分别计算溢出</title><desc id="desc">边 A，需求 13，容量 10，Overflow：3；边 B，需求 7，容量 9，Overflow：0；合计，总溢出 = 3 + 0 = 3，不能用 B 的余量抵消 A</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">两条 GCell 边要分别计算溢出</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">边 A</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">需求 13，容量 10</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">Overflow：3</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">边 B</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">需求 7，容量 9</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">Overflow：0</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">合计</text><text x="269" y="265" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">总溢出 = 3 + 0 = 3</text><text x="269" y="288" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">不能用 B 的余量抵消 A</text></svg>
