<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">DRV 的三个上限对应三个检查量</title><desc id="desc">Max Tran，限制信号边沿变化耗时，看 slew 的实际值与上限；Max Cap，限制驱动端看到的电容，拆出负载与互连所占部分；Max Fanout，限制扇出负载指标，以库和约束的计量口径为准</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">DRV 的三个上限对应三个检查量</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Max Tran</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">限制信号边沿变化耗时</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">看 slew 的实际值与上限</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Max Cap</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">限制驱动端看到的电容</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">拆出负载与互连所占部分</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Max Fanout</text><text x="269" y="265" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">限制扇出负载指标</text><text x="269" y="288" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">以库和约束的计量口径为准</text></svg>
