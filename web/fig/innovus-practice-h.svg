<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">同一条路径，用不同报告回答问题</title><desc id="desc">时序，Setup 看最迟到达，Hold 看最早，比较相同视图和路径边沿；电气约束，电容、转换时间和扇出各有上限，识别哪一项先触发超限；信号完整性，串扰可能造成噪声或延迟变化，看 aggressor、耦合与时序窗口</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">同一条路径，用不同报告回答问题</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">时序</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">Setup 看最迟到达，Hold 看最早</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">比较相同视图和路径边沿</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">电气约束</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">电容、转换时间和扇出各有上限</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">识别哪一项先触发超限</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">信号完整性</text><text x="269" y="265" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">串扰可能造成噪声或延迟变化</text><text x="269" y="288" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">看 aggressor、耦合与时序窗口</text></svg>
