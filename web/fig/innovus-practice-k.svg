<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">闩锁：触发不等于能持续自锁</title><desc id="desc">发生扰动，衬底或阱上出现局部电压变化，寄生器件可能被触发；正反馈，寄生 PNP 与 NPN 相互作用，满足维持条件时低阻通路可持续；版图预防，阱接触、衬底接触与保护环，按 PDK 规则和电源域检查</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">闩锁：触发不等于能持续自锁</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">发生扰动</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">衬底或阱上出现局部电压变化</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">寄生器件可能被触发</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">正反馈</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">寄生 PNP 与 NPN 相互作用</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">满足维持条件时低阻通路可持续</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">版图预防</text><text x="269" y="265" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">阱接触、衬底接触与保护环</text><text x="269" y="288" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">按 PDK 规则和电源域检查</text></svg>
