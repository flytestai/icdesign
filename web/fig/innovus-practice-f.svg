<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">CTS 的目标、结果与验收分开看</title><desc id="desc">前置检查，核对已定义的时钟和端点，确认约束、视图与单元可用；生成与布线，树结构、单元、NDR 分开配置，记录各类 sink 的处理方式；检查结果，同一视图比偏斜和插入延迟，回归 Setup、Hold 和电气规则</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">CTS 的目标、结果与验收分开看</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">前置检查</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">核对已定义的时钟和端点</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">确认约束、视图与单元可用</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">生成与布线</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">树结构、单元、NDR 分开配置</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">记录各类 sink 的处理方式</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Micro