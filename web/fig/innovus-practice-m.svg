<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title desc"><title id="title">ECO 只改必要对象，仍要完整复查</title><desc id="desc">冻结与选对象，保留基准、网表和变更范围，确认改动前后功能要求；实施最小修改，替换单元或插入中继后合法化，仅对受影响网络做增量布线；验收并决定保留，时序、连接、物理规则全复查，有超限就回退该轮改动</desc><rect width="720" height="330" rx="20" fill="#f1f5fb"/><text x="32" y="44" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">ECO 只改必要对象，仍要完整复查</text><rect x="32" y="66" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="101" r="16" fill="#e2edff"/><text x="60" y="106" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">1</text><text x="88" y="97" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">冻结与选对象</text><text x="269" y="95" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">保留基准、网表和变更范围</text><text x="269" y="118" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">确认改动前后功能要求</text><rect x="32" y="151" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="186" r="16" fill="#e2edff"/><text x="60" y="191" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">2</text><text x="88" y="182" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">实施最小修改</text><text x="269" y="180" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">替换单元或插入中继后合法化</text><text x="269" y="203" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">仅对受影响网络做增量布线</text><rect x="32" y="236" width="656" height="71" rx="12" fill="#fff" stroke="#d4deed"/><circle cx="60" cy="271" r="16" fill="#e2edff"/><text x="60" y="276" text-anchor="middle" fill="#16427a" font-family="sans-serif" font-size="14" font-weight="700">3</text><text x="88" y="267" fill="#172845" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">验收并决定保留</text><text x="269" y="265" fill="#233f63" font-family="Microsoft YaHei, sans-serif" font-size="16">时序、连接、物理规则全复查</text><text x="269" y="288" fill="#4d6079" font-family="Microsoft YaHei, sans-serif" font-size="14">有超限就回退该轮改动</text></svg>
