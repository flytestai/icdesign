server {
    listen 80;
    listen [::]:80;
    server_name ic.feice.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ic.feice.net;

    ssl_certificate     /etc/nginx/ssl/ic.feice.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ic.feice.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 4m;

    location /assets/ {
        # Cache-Control 由应用自己给（HTML no-cache、assets 带 ?v= 长缓存），
        # nginx 再叠一条会出现两个互相冲突的头，浏览器取哪个都说不准。
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
